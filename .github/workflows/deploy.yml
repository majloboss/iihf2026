name: Deploy to fellow.sk

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web
        env:
          VITE_API_URL: ${{ github.ref_name == 'main' && 'https://betclub.fellow.sk' || 'https://dev_betclub.fellow.sk' }}/api


      # Assety maju v nazve hash, ktory sa pri kazdom builde meni. Nahraju sa
      # preto pred index.html — inak by stranka chvilu ziadala subor, ktory
      # na serveri este nie je, a spadla by na bielu obrazovku:
      # "Loading failed for the module with source .../index-XXXX.js".
      - name: Deploy web assets via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: fellow.sk
          username: ftp.fellow.sk
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: web/dist/
          server-dir: ${{ github.ref_name == 'main' && '/sub/betclub/' || '/sub/dev_betclub/' }}
          state-name: ${{ github.ref_name == 'main' && '.ftp-deploy-sync-web.json' || '.ftp-deploy-sync-dev-betclub-web.json' }}
          exclude: |
            **/.git*
            **/.git*/**
            index.html
            sw.js

      # Az ked su assety na mieste, nahra sa index.html a service worker.
      #
      # Nahravaju sa priamo cez lftp, nie cez FTP-Deploy-Action: ta prechadza
      # cely strom (747 suborov) aj ked ma nahrat dva, cim sa deploy predlzil
      # o niekolko minut.
      - name: Deploy web index via FTP
        run: |
          sudo apt-get install -y --no-install-recommends lftp >/dev/null
          # Heslo berie lftp z premennej prostredia, takze sa neobjavi v zazname.
          # sw.js ide PRED index.html: service worker si drzi zoznam suborov a
          # ked zostane stary, ziada asset, na ktory uz index neukazuje —
          # vysledkom je biela obrazovka.
          CMD="set ssl:verify-certificate no; cd $SERVER_DIR;"
          CMD="$CMD put -O . web/dist/sw.js; put -O . web/dist/index.html; bye"
          lftp -u "ftp.fellow.sk,$FTP_PASSWORD" fellow.sk -e "$CMD"

          # Overenie, ze index.html a sw.js ukazuju na rovnaky build.
          #
          # Ked sa rozidu, service worker si drzi zoznam suborov z ineho buildu
          # a pri navigacii poda stranku zo svojej cache — stara verzia sa tak
          # vracia vsetkym pouzivatelom, nielen tomu, kto prave nasadzoval.
          #
          # Skusa sa opakovane: server nemusi novy subor podat okamzite.
          BASE="https://${SERVER_DIR#/sub/}"
          BASE="${BASE%/}.fellow.sk"
          OCAKAVANY=$(grep -o 'index-[A-Za-z0-9_-]*\.js' web/dist/index.html | head -1)
          echo "očakávaný build: ${OCAKAVANY:-?}"

          skus_overit() {
            for i in 1 2 3 4 5 6; do
              sleep 5
              JS_HTML=$(curl -s -H 'Cache-Control: no-cache' "$BASE/?cb=$RANDOM" | grep -o 'index-[A-Za-z0-9_-]*\.js' | head -1)
              JS_SW=$(curl -s -H 'Cache-Control: no-cache' "$BASE/sw.js?cb=$RANDOM" | grep -o 'index-[A-Za-z0-9_-]*\.js' | head -1)
              echo "  pokus $i: index.html -> ${JS_HTML:-?}, sw.js -> ${JS_SW:-?}"
              if [ -n "$JS_HTML" ] && [ "$JS_HTML" = "$JS_SW" ]                  && { [ -z "$OCAKAVANY" ] || [ "$JS_HTML" = "$OCAKAVANY" ]; }; then
                return 0
              fi
            done
            return 1
          }

          if skus_overit; then
            echo "index.html a sw.js sedia na rovnaky build."
          else
            # Nesulad znamena, ze niektory zo suborov sa nenahral. Nahra sa
            # znova — samotne cakanie problem nevyriesi.
            echo "::warning::index.html a sw.js sa rozchadzaju, nahravam znova."
            lftp -u "ftp.fellow.sk,$FTP_PASSWORD" fellow.sk -e "$CMD"

            if skus_overit; then
              echo "Po opakovanom nahrati uz subory sedia."
            else
              # Az teraz sa deploy zhodi: dva neuspesne pokusy uz nie su
              # docasny vypadok siete, ale stav, ktory by pouzivatelom podaval
              # staru verziu.
              echo "::error::index.html a sw.js sa rozchadzaju ani po opakovanom nahrati."
              exit 1
            fi
          fi
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SERVER_DIR: ${{ github.ref_name == 'main' && '/sub/betclub/' || '/sub/dev_betclub/' }}

      - name: Deploy API via FTP (main)
        if: github.ref_name == 'main'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: fellow.sk
          username: ftp.fellow.sk
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: api/
          server-dir: /sub/betclub/api/
          state-name: .ftp-deploy-sync-api.json
          exclude: |
            **/.git*
            **/.git*/**
            **/config/db.php
            setup_once.php
            sync_from_prod.php

      - name: Deploy API via FTP (develop)
        if: github.ref_name != 'main'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: fellow.sk
          username: ftp.fellow.sk
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: api/
          server-dir: /sub/dev_betclub/api/
          state-name: .ftp-deploy-sync-dev-betclub-api.json
          exclude: |
            **/.git*
            **/.git*/**
            **/config/db.php
